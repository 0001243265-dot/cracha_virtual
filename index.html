<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crachá de Perfil</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="card-perfil">
        <div class="fundo">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Dev&quot; alt="Avatar" class="avatar">
        </div>

        <h2>Felippe Aguiar </h2>

        <p class="profissao">Desenvolvedor Web em Formação</p>

        <p class="bio">
            Sou estudante 
            <span class="destaque-senai">SENAI</span>,
            aprendendo desenvolvimento web e buscando minha
            primeira oportunidade profissional na área de tecnologia.
        </p>

        <div class="habilidades">
            <span class="badge badge-html">HTML5</span>
            <span class="badge badge-css">CSS3</span>
            <span class="badge badge-git">Git</span>
        </div>

        <div class="status">
            <span class="badge-status">
                ● Disponível para estágio
            </span>
        </div>
    </div>

</body>
</html>
